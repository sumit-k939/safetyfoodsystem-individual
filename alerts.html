<span>🔴</span>

<div>

<strong>
HIGH TEMPERATURE
</strong>

<span>🟡</span>

<div>

<strong>

</p>

</div>

</div>


<div class="alert-item success">

<span>🟢</span>

<div>

<strong>

</strong>

<p>

</div>
